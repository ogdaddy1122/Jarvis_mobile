name: Build JARVIS APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Android
        uses: android-actions/setup-android@v3
      - name: Create project
        run: |
          echo "include ':app'" > settings.gradle
          echo "buildscript {}" > build.gradle
          mkdir -p app/src/main/java/com/jarvis/mobile
          cat > app/build.gradle <<'ENDGRADLE'
          plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }
          android { namespace 'com.jarvis.mobile'; compileSdk 34; defaultConfig { applicationId "com.jarvis.mobile"; minSdk 26; targetSdk 34; versionCode 1; versionName "1.0" }; buildTypes { debug { minifyEnabled false } }; compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }; kotlinOptions { jvmTarget = '17' }; buildFeatures { compose true }; composeOptions { kotlinCompilerExtensionVersion '1.5.8' } }
          dependencies { implementation 'androidx.core:core-ktx:1.12.0'; implementation 'androidx.activity:activity-compose:1.8.2'; implementation 'androidx.compose.ui:ui:1.6.8'; implementation 'androidx.compose.material3:material3:1.2.1' }
          ENDGRADLE
          cat > app/src/main/AndroidManifest.xml <<'ENDMANIFEST'
          <?xml version="1.0" encoding="utf-8"?><manifest xmlns:android="http://schemas.android.com/apk/res/android"><application android:label="JARVIS" android:theme="@android:style/Theme.Material.Light"><activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application></manifest>
          ENDMANIFEST
          cat > app/src/main/java/com/jarvis/mobile/MainActivity.kt <<'ENDKOTLIN'
          package com.jarvis.mobile
          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.foundation.layout.*
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.unit.dp
          class MainActivity: ComponentActivity(){ override fun onCreate(savedInstanceState: Bundle?){ super.onCreate(savedInstanceState); setContent{ JarvisApp() } } }
          @OptIn(ExperimentalMaterial3Api::class)
          @Composable fun JarvisApp(){ var input by remember{ mutableStateOf("") }; var log by remember{ mutableStateOf("JARVIS Online") }; Scaffold(topBar={TopAppBar(title={Text("JARVIS")})}){ p -> Column(Modifier.padding(p).padding(16.dp)){ Text(log); OutlinedTextField(value=input, onValueChange={input=it}, label={Text("Command")}, modifier=Modifier.fillMaxWidth()); Button(onClick={log="Run: $input"}){ Text("Run") } } } }
          ENDKOTLIN
      - name: Build APK
        uses: gradle/gradle-build-action@v3
        with:
          arguments: :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-apk
          path: app/build/outputs/apk/debug/app-debug.apk

name: Build JARVIS APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'
      - name: Setup SDK
        run: |
          mkdir -p $ANDROID_HOME/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmd.zip
          unzip -q cmd.zip -d $ANDROID_HOME/cmdline-tools
          mv $ANDROID_HOME/cmdline-tools/cmdline-tools $ANDROID_HOME/cmdline-tools/latest
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
      - name: Create Project
        run: |
          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          include ':app'
          EOF
          echo "" > build.gradle
          mkdir -p app/src/main/java/com/jarvis/mobile
          mkdir -p app/src/main/res/values
          echo '<resources><string name="app_name">JARVIS</string></resources>' > app/src/main/res/values/strings.xml
          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.1.4' }
          android {
              namespace 'com.jarvis.mobile'
              compileSdk 34
              defaultConfig { applicationId "com.jarvis.mobile"; minSdk 24; targetSdk 34; versionCode 1; versionName "1.0" }
              compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
              buildTypes { debug { minifyEnabled false } }
          }
          dependencies { implementation 'androidx.appcompat:appcompat:1.6.1' }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application android:label="JARVIS">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          cat > app/src/main/java/com/jarvis/mobile/MainActivity.java <<'EOF'
          package com.jarvis.mobile;
          import android.os.Bundle; import android.widget.TextView; import androidx.appcompat.app.AppCompatActivity;
          public class MainActivity extends AppCompatActivity {
              @Override protected void onCreate(Bundle s) {
                  super.onCreate(s);
                  TextView tv = new TextView(this);
                  tv.setText("JARVIS ONLINE!\nBuild Success Boss!");
                  tv.setTextSize(26); tv.setPadding(50,400,50,50);
                  setContentView(tv);
              }
          }
          EOF
          gradle wrapper --gradle-version 8.5
                  echo "android.useAndroidX=true" >
          gradle.properties
                  echo 
          "android.enableJetifier=true" >>
          gradle.properties
      - name: Build
        run: ./gradlew :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-apk
          path: app/build/outputs/apk/debug/app-debug.apk
